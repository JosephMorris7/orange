[package]
name = "orange-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orange: drag, tap, drop file converter and toolbox for Windows"
default-run = "Orange"

[lib]
name = "orange_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Orange"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orange-core.workspace = true
orange-convert.workspace = true
orange-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
dirs = "7.0.0"
log = { version = "0.4.34", features = ["std"] }
tauri-plugin-drag = "2.1.1"
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_FaceAnalysis",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
]

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"

[dev-dependencies]
tempfile.workspace = true
